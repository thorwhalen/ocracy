[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ocracy"
version = "0.1.3"
description = "Facade to many implementations of (OCR) image-to-text-characters engines"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ocr",
    "facade",
    "tesseract",
    "image-to-text",
    "document-ai",
]
authors = [
    { name = "Thor Whalen" },
]
# Intentionally empty: importing ocracy must stay dependency-free. Every backend
# and optional feature (pandas, Pillow, engine SDKs) is pulled in via an extra
# and imported lazily. See [project.optional-dependencies].
dependencies = []

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/ocracy"
Repository = "https://github.com/thorwhalen/ocracy"
Documentation = "https://thorwhalen.github.io/ocracy"

[project.scripts]
ocracy = "ocracy.__main__:main"

[project.optional-dependencies]
# --- per-backend extras (install only what you use) ---
tesseract = ["pytesseract>=0.3.10", "Pillow>=9"]
easyocr = ["easyocr>=1.7"]
paddleocr = ["paddleocr>=2.7", "paddlepaddle>=2.5"]
rapidocr = ["rapidocr-onnxruntime>=1.3", "Pillow>=9"]
doctr = ["python-doctr>=0.8"]
ocrmac = ["ocrmac>=0.2"]
google-vision = ["google-cloud-vision>=3", "Pillow>=9"]
aws-textract = ["boto3>=1.28", "Pillow>=9"]
azure = ["azure-ai-documentintelligence>=1", "Pillow>=9"]
mistral = ["mistralai>=1"]
openai = ["openai>=1", "Pillow>=9"]
anthropic = ["anthropic>=0.40", "Pillow>=9"]
mathpix = ["requests>=2.28"]
ocr-space = ["requests>=2.28"]
pix2tex = ["pix2tex>=0.1", "Pillow>=9"]
trocr = ["transformers>=4.40", "torch>=2", "Pillow>=9"]
# --- feature extras ---
cli = ["argh>=0.30", "argcomplete>=3"]  # the `ocracy` command
image = ["Pillow>=9", "numpy>=1.23"]   # input normalization helpers
table = ["pandas>=1.5"]                # catalog.to_dataframe()
# --- dev/docs ---
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "Pillow>=9",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build.targets.wheel]
# Ship the package including the ledger data files (data/*.json, *.md) and the
# backend template that scaffold_backend reads at runtime.
packages = ["ocracy"]

[tool.hatch.build.targets.sdist]
include = ["ocracy", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
